<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Clock</title>
<meta name="description" content="A minimal world clock: your cities side by side, with a timeline you can drag to see what time it will be everywhere.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0C11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clocks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..500&family=Instrument+Serif&display=swap">
<style>
/* Layout: one quiet column of cities; each row carries a 24-hour strip, all strips aligned on one shared instant */
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --field: #E9EBF0;
  --fg: #151821;
  --muted: #6C7282;
  --line: #E1E4EA;
  --night: #D3D9E5;
  --day: #FBEFD6;
  --strip-ink: #5B6273;
  --accent: #D27A12;
  --on-accent: #FFFFFF;
  --danger: #D9443B;
  --on-danger: #FFFFFF;
  --scrim: rgba(20, 24, 33, .28);
  --serif: "Instrument Serif", "New York", "Iowan Old Style", Georgia, serif;
  --sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0C11; --surface: #14171F; --field: #1E222C; --fg: #ECEEF2; --muted: #868C9B;
    --line: #1C2029; --night: #131823; --day: #3B3322; --strip-ink: #9AA0AE;
    --accent: #F0A63A; --on-accent: #1A1206; --danger: #E5564C; --on-danger: #FFFFFF;
    --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0C11; --surface: #14171F; --field: #1E222C; --fg: #ECEEF2; --muted: #868C9B;
  --line: #1C2029; --night: #131823; --day: #3B3322; --strip-ink: #9AA0AE;
  --accent: #F0A63A; --on-accent: #1A1206; --danger: #E5564C; --on-danger: #FFFFFF;
  --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.4 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, .time:focus-within, .search:focus-visible, .switch input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 4px) calc(env(safe-area-inset-bottom, 0px) + 40px);
}

.bar { display: flex; justify-content: flex-end; align-items: center; gap: 4px; height: 44px; }
.text-btn { font-size: 16px; color: var(--accent); padding: 8px 8px; font-weight: 450; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--accent); }
.icon-btn svg { width: 22px; height: 22px; }

.title { font: 400 44px/1 var(--serif); letter-spacing: -.01em; margin: 2px 0 6px; text-wrap: balance; }
.status { display: flex; align-items: center; gap: 10px; min-height: 32px; color: var(--muted); font-size: 13px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.status.live .dot { animation: pulse 2.4s ease-in-out infinite; }
.status.pinned .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--accent); }
.status.pinned #statusText { color: var(--fg); }
.pill { font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 500; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

.list { list-style: none; margin: 14px 0 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 16px 0 15px; border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }
.row.dragging { opacity: .55; }
.body { flex: 1; min-width: 0; display: grid; gap: 11px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.who { min-width: 0; }
.name { font: 400 27px/1.05 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name .loc { width: 13px; height: 13px; color: var(--accent); margin-left: 6px; vertical-align: 2px; }
.meta { margin-top: 5px; font-size: 12.5px; color: var(--muted); letter-spacing: .01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.time {
  position: relative; display: flex; align-items: baseline; gap: 3px; flex-shrink: 0;
  font-weight: 200; font-size: 46px; line-height: .9; letter-spacing: -.035em;
  font-variant-numeric: tabular-nums; cursor: pointer;
}
.ap { font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.ap:empty { display: none; }
.time input {
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
  font-size: 16px; border: 0; margin: 0; padding: 0; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.strip {
  display: block; width: 100%; height: 26px; border-radius: 6px;
  touch-action: pan-y; cursor: ew-resize;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 13%, #000 87%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 13%, #000 87%, transparent);
}
.note { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); margin-top: -2px; }
.note::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

.remove, .handle { display: none; }
.remove { width: 24px; height: 24px; border-radius: 50%; background: var(--danger); color: var(--on-danger); place-items: center; flex-shrink: 0; }
.remove svg { width: 12px; height: 12px; }
.handle { width: 36px; height: 40px; place-items: center; color: var(--muted); touch-action: none; cursor: grab; flex-shrink: 0; }
.handle svg { width: 18px; height: 18px; }
.editing .row:not(.here) .remove, .editing .row:not(.here) .handle { display: grid; }
.editing .strip, .editing .note { display: none; }
.editing .time { pointer-events: none; opacity: .45; font-size: 34px; }
.change { display: none; font-size: 14px; flex-shrink: 0; }
.editing .row.here .change { display: block; }
.editing .row.here .time { opacity: .3; }

.hint { margin: 18px 0 0; font-size: 12.5px; color: var(--muted); max-width: 40ch; }
.prefs { margin-top: 22px; display: grid; gap: 4px; }
.switch { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 15px; cursor: pointer; }
.switch input {
  -webkit-appearance: none; appearance: none; margin: 0; width: 46px; height: 28px; border-radius: 999px;
  background: var(--field); position: relative; transition: background .2s; cursor: pointer; flex-shrink: 0;
}
.switch input::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s;
}
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }

.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; height: min(88%, 760px); background: var(--surface); color: var(--fg);
  border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: rise .3s cubic-bezier(.2, .8, .2, 1);
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet-head {
  display: flex; gap: 8px; align-items: center;
  padding-block: 14px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.sheet-title { font: 400 24px/1 var(--serif); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-top: 18px; margin: 0; }
.search { flex: 1; min-width: 0; font: 16px var(--sans); padding: 10px 12px; border-radius: 10px; border: 0; background: var(--field); color: var(--fg); -webkit-appearance: none; appearance: none; }
.search::placeholder { color: var(--muted); }
.results { list-style: none; margin: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.result {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left;
}
.result:disabled { opacity: .4; cursor: default; }
.r-who { min-width: 0; }
.r-name { font-size: 16px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-country { font-size: 12.5px; color: var(--muted); display: block; }
.r-time { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.r-time b { display: block; color: var(--fg); font-weight: 400; font-size: 16px; }
.empty { color: var(--muted); padding: 24px 0; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <div class="bar">
    <button class="text-btn" id="editBtn" type="button">Edit</button>
    <button class="icon-btn" id="addBtn" type="button" aria-label="Add a city">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <h1 class="title">World Clock</h1>
  <div class="status live" id="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">Now</span>
    <button class="pill" id="nowBtn" type="button" hidden>Back to now</button>
  </div>

  <ul class="list" id="list"></ul>

  <p class="hint" id="hint">Drag any timeline to move through the day. Tap a time to set it, and every other city follows.</p>
  <div class="prefs" id="prefs" hidden>
    <label class="switch" for="h24"><span>24-hour time</span><input type="checkbox" id="h24" role="switch"></label>
  </div>
</main>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 class="sheet-title" id="sheetTitle">Add a city</h2>
    <div class="sheet-head">
      <input class="search" id="q" type="search" placeholder="City, country or time zone" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button class="text-btn" id="cancelAdd" type="button">Cancel</button>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const M = 60000, H = 3600000, D = 86400000, Q = 15 * M;
  const KEY = 'worldclock.v1';
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // name|country|IANA zone. Time zone rules come from the device, so DST changes stay current with OS updates.
  const CITY_DATA = `
Tehran|Iran|Asia/Tehran
Mashhad|Iran|Asia/Tehran
Isfahan|Iran|Asia/Tehran
Shiraz|Iran|Asia/Tehran
Tabriz|Iran|Asia/Tehran
London|United Kingdom|Europe/London
Manchester|United Kingdom|Europe/London
Edinburgh|United Kingdom|Europe/London
Dublin|Ireland|Europe/Dublin
Paris|France|Europe/Paris
Berlin|Germany|Europe/Berlin
Munich|Germany|Europe/Berlin
Frankfurt|Germany|Europe/Berlin
Hamburg|Germany|Europe/Berlin
Amsterdam|Netherlands|Europe/Amsterdam
Brussels|Belgium|Europe/Brussels
Luxembourg|Luxembourg|Europe/Luxembourg
Zurich|Switzerland|Europe/Zurich
Geneva|Switzerland|Europe/Zurich
Vienna|Austria|Europe/Vienna
Rome|Italy|Europe/Rome
Milan|Italy|Europe/Rome
Madrid|Spain|Europe/Madrid
Barcelona|Spain|Europe/Madrid
Lisbon|Portugal|Europe/Lisbon
Stockholm|Sweden|Europe/Stockholm
Oslo|Norway|Europe/Oslo
Copenhagen|Denmark|Europe/Copenhagen
Helsinki|Finland|Europe/Helsinki
Reykjavik|Iceland|Atlantic/Reykjavik
Warsaw|Poland|Europe/Warsaw
Prague|Czechia|Europe/Prague
Budapest|Hungary|Europe/Budapest
Athens|Greece|Europe/Athens
Bucharest|Romania|Europe/Bucharest
Sofia|Bulgaria|Europe/Sofia
Belgrade|Serbia|Europe/Belgrade
Zagreb|Croatia|Europe/Zagreb
Istanbul|Türkiye|Europe/Istanbul
Ankara|Türkiye|Europe/Istanbul
Kyiv|Ukraine|Europe/Kiev
Moscow|Russia|Europe/Moscow
Tbilisi|Georgia|Asia/Tbilisi
Yerevan|Armenia|Asia/Yerevan
Baku|Azerbaijan|Asia/Baku
Dubai|United Arab Emirates|Asia/Dubai
Abu Dhabi|United Arab Emirates|Asia/Dubai
Doha|Qatar|Asia/Qatar
Riyadh|Saudi Arabia|Asia/Riyadh
Jeddah|Saudi Arabia|Asia/Riyadh
Kuwait City|Kuwait|Asia/Kuwait
Manama|Bahrain|Asia/Bahrain
Muscat|Oman|Asia/Muscat
Baghdad|Iraq|Asia/Baghdad
Erbil|Iraq|Asia/Baghdad
Amman|Jordan|Asia/Amman
Beirut|Lebanon|Asia/Beirut
Damascus|Syria|Asia/Damascus
Jerusalem|Israel|Asia/Jerusalem
Tel Aviv|Israel|Asia/Jerusalem
Cairo|Egypt|Africa/Cairo
Kabul|Afghanistan|Asia/Kabul
Herat|Afghanistan|Asia/Kabul
Karachi|Pakistan|Asia/Karachi
Lahore|Pakistan|Asia/Karachi
Islamabad|Pakistan|Asia/Karachi
Delhi|India|Asia/Kolkata
Mumbai|India|Asia/Kolkata
Bengaluru|India|Asia/Kolkata
Kathmandu|Nepal|Asia/Kathmandu
Dhaka|Bangladesh|Asia/Dhaka
Colombo|Sri Lanka|Asia/Colombo
Tashkent|Uzbekistan|Asia/Tashkent
Almaty|Kazakhstan|Asia/Almaty
Bangkok|Thailand|Asia/Bangkok
Ho Chi Minh City|Vietnam|Asia/Ho_Chi_Minh
Hanoi|Vietnam|Asia/Ho_Chi_Minh
Jakarta|Indonesia|Asia/Jakarta
Kuala Lumpur|Malaysia|Asia/Kuala_Lumpur
Singapore|Singapore|Asia/Singapore
Manila|Philippines|Asia/Manila
Hong Kong|China|Asia/Hong_Kong
Taipei|Taiwan|Asia/Taipei
Beijing|China|Asia/Shanghai
Shanghai|China|Asia/Shanghai
Shenzhen|China|Asia/Shanghai
Seoul|South Korea|Asia/Seoul
Tokyo|Japan|Asia/Tokyo
Osaka|Japan|Asia/Tokyo
Perth|Australia|Australia/Perth
Adelaide|Australia|Australia/Adelaide
Darwin|Australia|Australia/Darwin
Brisbane|Australia|Australia/Brisbane
Sydney|Australia|Australia/Sydney
Melbourne|Australia|Australia/Melbourne
Hobart|Australia|Australia/Hobart
Auckland|New Zealand|Pacific/Auckland
Wellington|New Zealand|Pacific/Auckland
Suva|Fiji|Pacific/Fiji
Honolulu|United States|Pacific/Honolulu
Anchorage|United States|America/Anchorage
Los Angeles|United States|America/Los_Angeles
San Francisco|United States|America/Los_Angeles
San Diego|United States|America/Los_Angeles
Seattle|United States|America/Los_Angeles
Las Vegas|United States|America/Los_Angeles
Vancouver|Canada|America/Vancouver
Phoenix|United States|America/Phoenix
Denver|United States|America/Denver
Salt Lake City|United States|America/Denver
Calgary|Canada|America/Edmonton
Chicago|United States|America/Chicago
Dallas|United States|America/Chicago
Houston|United States|America/Chicago
Austin|United States|America/Chicago
Mexico City|Mexico|America/Mexico_City
Winnipeg|Canada|America/Winnipeg
New York|United States|America/New_York
Washington, D.C.|United States|America/New_York
Boston|United States|America/New_York
Miami|United States|America/New_York
Atlanta|United States|America/New_York
Toronto|Canada|America/Toronto
Montreal|Canada|America/Toronto
Ottawa|Canada|America/Toronto
Halifax|Canada|America/Halifax
St. John's|Canada|America/St_Johns
Havana|Cuba|America/Havana
Bogotá|Colombia|America/Bogota
Lima|Peru|America/Lima
Caracas|Venezuela|America/Caracas
Santiago|Chile|America/Santiago
Buenos Aires|Argentina|America/Argentina/Buenos_Aires
São Paulo|Brazil|America/Sao_Paulo
Rio de Janeiro|Brazil|America/Sao_Paulo
Casablanca|Morocco|Africa/Casablanca
Algiers|Algeria|Africa/Algiers
Tunis|Tunisia|Africa/Tunis
Dakar|Senegal|Africa/Dakar
Lagos|Nigeria|Africa/Lagos
Accra|Ghana|Africa/Accra
Kinshasa|DR Congo|Africa/Kinshasa
Addis Ababa|Ethiopia|Africa/Addis_Ababa
Nairobi|Kenya|Africa/Nairobi
Johannesburg|South Africa|Africa/Johannesburg
Cape Town|South Africa|Africa/Johannesburg
UTC|Coordinated Universal Time|UTC`;

  const validZone = z => { try { new Intl.DateTimeFormat('en-US', { timeZone: z }); return true; } catch (e) { return false; } };
  const zoneCityName = z => (z.split('/').pop() || z).replace(/_/g, ' ');
  const CITIES = CITY_DATA.trim().split('\n').map(l => {
    const [name, country, zone] = l.split('|');
    return { name, country, zone };
  }).filter(c => validZone(c.zone));

  let EXTRA = [];
  try {
    const known = new Set(CITIES.map(c => c.zone));
    EXTRA = Intl.supportedValuesOf('timeZone').filter(z => !known.has(z)).map(z => ({
      name: zoneCityName(z), country: z.includes('/') ? z.split('/')[0].replace(/_/g, ' ') : 'Time zone', zone: z
    }));
  } catch (e) { /* older engines: curated list only */ }

  const HERE_ZONE = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { return 'UTC'; } })();
  // Muscat is an alias of Dubai's zone; iPhones in the UAE can report either one.
  const PREFERRED_HOME = { 'Asia/Muscat': 'Dubai', 'Asia/Dubai': 'Dubai' };
  // Stored per device zone, so a chosen city doesn't follow you when you travel.
  function hereCity() {
    const own = state.homeFor && state.homeFor[HERE_ZONE];
    if (own && validZone(own.zone)) return own;
    return CITIES.find(c => c.name === PREFERRED_HOME[HERE_ZONE])
      || CITIES.find(c => c.zone === HERE_ZONE && c.name === zoneCityName(HERE_ZONE))
      || CITIES.find(c => c.zone === HERE_ZONE)
      || { name: zoneCityName(HERE_ZONE), country: '', zone: HERE_ZONE };
  }

  // ---- time math ----
  const fmtCache = new Map();
  const partsFmt = zone => {
    let f = fmtCache.get(zone);
    if (!f) {
      f = new Intl.DateTimeFormat('en-US', {
        timeZone: zone, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric',
        hour: 'numeric', minute: 'numeric', second: 'numeric'
      });
      fmtCache.set(zone, f);
    }
    return f;
  };
  // Offsets only change on 15-minute boundaries, so cache per zone per 15-minute bucket.
  const offCache = new Map();
  function offsetMin(zone, t) {
    const b = Math.floor(t / Q) * Q;
    const key = zone + b;
    let v = offCache.get(key);
    if (v === undefined) {
      const p = {};
      for (const x of partsFmt(zone).formatToParts(b)) p[x.type] = x.value;
      const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
      v = Math.round((asUTC - b) / M);
      if (offCache.size > 50000) offCache.clear();
      offCache.set(key, v);
    }
    return v;
  }
  function wall(zone, t) {
    const off = offsetMin(zone, t);
    const local = t + off * M;
    const d = new Date(local);
    return { off, y: d.getUTCFullYear(), mo: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), wd: d.getUTCDay(), day: Math.floor(local / D) };
  }
  // Instant at which the zone's wall clock reads the given local timestamp.
  function fromWall(zone, local) {
    let u = local - offsetMin(zone, local) * M;
    u = local - offsetMin(zone, u) * M;
    return u;
  }

  const pad = n => String(n).padStart(2, '0');
  const fmtTime = w => state.h24
    ? { hm: pad(w.h) + ':' + pad(w.mi), ap: '' }
    : { hm: (w.h % 12 || 12) + ':' + pad(w.mi), ap: w.h < 12 ? 'am' : 'pm' };
  function fmtDiff(min) {
    if (min === 0) return 'same time';
    const a = Math.abs(min), h = Math.floor(a / 60), m = a % 60;
    return (min > 0 ? '+' : '−') + (h ? h + 'h' : '') + (m ? (h ? ' ' : '') + m + 'm' : '');
  }
  function fmtSpan(ms) {
    const total = Math.round(Math.abs(ms) / M), d = Math.floor(total / 1440), h = Math.floor(total % 1440 / 60), m = total % 60;
    return [d && d + 'd', h && h + 'h', m && m + 'm'].filter(Boolean).join(' ') || '0m';
  }
  const dateLabel = w => `${WD[w.wd]} ${w.d} ${MON[w.mo]}`;

  // Nearest clock change between 10 days ago and 3 weeks ahead.
  const dstCache = new Map();
  function clockChange(zone, now) {
    const key = zone + Math.floor(now / H);
    if (dstCache.has(key)) return dstCache.get(key);
    let found = null;
    const start = Math.floor((now - 10 * D) / Q) * Q, end = now + 21 * D, step = 6 * H;
    let prevT = start, prevO = offsetMin(zone, start);
    for (let t = start + step; t <= end; t += step) {
      const o = offsetMin(zone, t);
      if (o !== prevO) {
        let lo = prevT, hi = t;
        while (hi - lo > Q) {
          const mid = lo + Math.floor((hi - lo) / (2 * Q)) * Q;
          if (offsetMin(zone, mid) === prevO) lo = mid; else hi = mid;
        }
        found = { at: hi, delta: o - prevO };
        if (hi > now) break; // prefer the upcoming change if there is one
      }
      prevT = t; prevO = o;
    }
    dstCache.set(key, found);
    return found;
  }
  function changeText(zone, ch, now) {
    const amt = Math.abs(ch.delta) % 60 === 0 ? (Math.abs(ch.delta) / 60 === 1 ? '1 hour' : Math.abs(ch.delta) / 60 + ' hours') : Math.abs(ch.delta) + ' min';
    const dir = ch.delta < 0 ? 'back' : 'forward';
    const when = dateLabel(wall(zone, ch.at));
    if (ch.at <= now) return `Clocks went ${dir} ${amt} on ${when}`;
    const days = Math.round((ch.at - now) / D);
    return `Clocks go ${dir} ${amt} on ${when}` + (days <= 1 ? (days === 0 ? ', today' : ', tomorrow') : `, in ${days} days`);
  }

  // ---- state ----
  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
    save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* private mode */ } }
  };
  const defaultH24 = (() => {
    try { const hc = new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hourCycle; return hc === 'h23' || hc === 'h24'; }
    catch (e) { return true; }
  })();
  const pick = name => CITIES.find(c => c.name === name);
  let state = store.load();
  if (!state || !Array.isArray(state.cities)) {
    state = { cities: ['Tehran', 'London', 'New York'].map(pick).filter(c => c && c.zone !== HERE_ZONE), h24: defaultH24 };
  }
  state.cities = state.cities.filter(c => c && validZone(c.zone)).map(c => ({ name: String(c.name), country: String(c.country || ''), zone: c.zone }));
  if (typeof state.h24 !== 'boolean') state.h24 = defaultH24;
  if (!state.homeFor || typeof state.homeFor !== 'object') state.homeFor = {};

  let pinned = null;   // fixed instant (ms) while scrubbing or after setting a time; null = live
  let editing = false;
  let rows = [];

  // ---- dom ----
  const $ = id => document.getElementById(id);
  const list = $('list'), statusEl = $('status'), statusText = $('statusText'), nowBtn = $('nowBtn');
  const editBtn = $('editBtn'), addBtn = $('addBtn'), hint = $('hint'), prefs = $('prefs'), h24Box = $('h24');
  const sheet = $('sheet'), q = $('q'), results = $('results'), cancelAdd = $('cancelAdd');
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  const ICON_LOC = '<svg class="loc" viewBox="0 0 24 24" fill="currentColor" aria-label="Your location"><path d="M21 3 3 10.5l7.5 2.9L13.4 21z"/></svg>';
  const ICON_MINUS = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2.5 6h7"/></svg>';
  const ICON_GRIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h16M4 12h16M4 16h16"/></svg>';

  function buildList() {
    list.textContent = '';
    rows = [{ ...hereCity(), here: true }, ...state.cities].map(c => {
      const li = document.createElement('li');
      li.className = 'row' + (c.here ? ' here' : '');
      li.innerHTML = `
        ${c.here ? '' : `<button class="remove" type="button" aria-label="Remove ${esc(c.name)}">${ICON_MINUS}</button>`}
        <div class="body">
          <div class="head">
            <div class="who"><div class="name">${esc(c.name)}${c.here ? ICON_LOC : ''}</div><div class="meta"></div></div>
            <label class="time"><span class="hm"></span><span class="ap"></span><input type="time" aria-label="Set the time in ${esc(c.name)}"></label>
          </div>
          <canvas class="strip" aria-hidden="true"></canvas>
          <div class="note" hidden></div>
        </div>
        ${c.here ? '<button class="text-btn change" type="button">Change</button>' : `<span class="handle" aria-hidden="true">${ICON_GRIP}</span>`}`;
      const r = {
        c, el: li, hm: li.querySelector('.hm'), ap: li.querySelector('.ap'), meta: li.querySelector('.meta'),
        input: li.querySelector('input'), canvas: li.querySelector('canvas'), note: li.querySelector('.note')
      };
      li._row = r;
      wireRow(r);
      list.appendChild(li);
      return r;
    });
    render();
  }

  function wireRow(r) {
    const setFromInput = () => {
      const m = /^(\d{1,2}):(\d{2})/.exec(r.input.value);
      if (!m) return;
      const w = wall(r.c.zone, pinned ?? Date.now());
      pinned = fromWall(r.c.zone, Date.UTC(w.y, w.mo, w.d, +m[1], +m[2]));
      render();
    };
    r.input.addEventListener('input', setFromInput);
    r.input.addEventListener('change', setFromInput);
    r.input.addEventListener('click', () => { try { r.input.showPicker && r.input.showPicker(); } catch (e) { /* not allowed here */ } });

    // Scrub: drag left to move forward in time, right to go back.
    let drag = null;
    r.canvas.addEventListener('pointerdown', e => {
      if (editing) return;
      drag = { x: e.clientX, t: pinned ?? Date.now(), pph: pxPerHour(r.canvas.clientWidth), active: false };
      try { r.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    r.canvas.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (!drag.active && Math.abs(dx) < 4) return;
      drag.active = true;
      pinned = Math.round((drag.t - dx / drag.pph * H) / Q) * Q;
      requestRender();
    });
    const end = () => {
      if (!drag) return;
      drag = null;
      if (pinned !== null && Math.abs(pinned - Date.now()) < 8 * M) pinned = null;
      requestRender();
    };
    r.canvas.addEventListener('pointerup', end);
    r.canvas.addEventListener('pointercancel', end);

    const rm = r.el.querySelector('.remove');
    if (rm) rm.addEventListener('click', () => {
      state.cities = state.cities.filter(c => c !== r.c);
      store.save();
      buildList();
    });
    const change = r.el.querySelector('.change');
    if (change) change.addEventListener('click', () => openSheet('home'));
    const handle = r.el.querySelector('.handle');
    if (handle) handle.addEventListener('pointerdown', e => startReorder(e, handle, r.el));
  }

  function startReorder(e, handle, li) {
    e.preventDefault();
    try { handle.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    li.classList.add('dragging');
    const move = ev => {
      const others = [...list.querySelectorAll('.row:not(.here)')].filter(x => x !== li);
      const before = others.find(s => { const b = s.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });
      if (before) { if (li.nextElementSibling !== before) list.insertBefore(li, before); }
      else if (list.lastElementChild !== li) list.appendChild(li);
    };
    const up = () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      li.classList.remove('dragging');
      rows = [...list.children].map(x => x._row);
      state.cities = rows.filter(x => !x.c.here).map(x => x.c);
      store.save();
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  }

  // ---- timeline strip ----
  const pxPerHour = w => Math.max(26, Math.min(44, w / 12));
  const hex = s => { s = s.trim().replace('#', ''); return [0, 2, 4].map(i => parseInt(s.slice(i, i + 2), 16)); };
  let colors = null;
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    colors = {
      night: hex(cs.getPropertyValue('--night')), day: hex(cs.getPropertyValue('--day')),
      ink: cs.getPropertyValue('--strip-ink').trim(), fg: cs.getPropertyValue('--fg').trim(), accent: cs.getPropertyValue('--accent').trim()
    };
  }
  // 0 at night, 1 in full daylight, a soft ramp through dawn and dusk.
  function dayness(h) {
    const s = -Math.cos(2 * Math.PI * (h + 0.5) / 24);
    return Math.min(1, Math.max(0, (s + 0.25) / 0.6));
  }
  const mix = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;

  function drawStrip(cv, zone, T) {
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    const dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const pph = pxPerHour(w), cx = w / 2;
    const local = T + offsetMin(zone, T) * M;
    const base = Math.floor(local / H) * H;
    const span = Math.ceil(cx / pph) + 2;
    const marks = [];
    for (let k = -span; k <= span + 1; k++) {
      const L = base + k * H;
      marks.push({ x: cx + (fromWall(zone, L) - T) / H * pph, d: new Date(L) });
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < marks.length - 1; i++) {
      const x0 = marks[i].x, x1 = marks[i + 1].x;
      if (x1 <= x0 || x1 < 0 || x0 > w) continue;
      const hr = marks[i].d.getUTCHours();
      ctx.fillStyle = mix(colors.night, colors.day, dayness(hr));
      ctx.fillRect(x0 + 0.5, 0, x1 - x0 - 1, h);
      if (x1 - x0 < 16) continue;
      ctx.globalAlpha = Math.min(1, Math.max(0, (Math.abs((x0 + x1) / 2 - cx) - 6) / 10));
      if (hr === 0) {
        ctx.font = '500 10.5px Geist, -apple-system, system-ui, sans-serif';
        ctx.fillStyle = colors.fg;
        ctx.fillText(WD[marks[i].d.getUTCDay()], (x0 + x1) / 2, h / 2 + 0.5);
      } else {
        ctx.font = '400 11px Geist, -apple-system, system-ui, sans-serif';
        ctx.fillStyle = colors.ink;
        ctx.fillText(String(state.h24 ? hr : (hr % 12 || 12)), (x0 + x1) / 2, h / 2 + 0.5);
      }
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = colors.accent;
    ctx.fillRect(Math.round(cx) - 1, 0, 2, h);
  }

  // ---- render ----
  function render() {
    readColors();
    const now = Date.now();
    const T = pinned ?? now;
    const here = wall(HERE_ZONE, T);
    for (const r of rows) {
      const w = wall(r.c.zone, T);
      const t = fmtTime(w);
      r.hm.textContent = t.hm;
      r.ap.textContent = t.ap;
      if (r.c.here) {
        r.meta.textContent = dateLabel(w);
      } else {
        const dd = w.day - here.day;
        const day = dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : dd === -1 ? 'Yesterday' : WD[w.wd];
        r.meta.textContent = `${day}, ${fmtDiff(w.off - here.off)}`;
      }
      if (document.activeElement !== r.input) r.input.value = pad(w.h) + ':' + pad(w.mi);
      const ch = clockChange(r.c.zone, now);
      r.note.hidden = !ch;
      if (ch) r.note.textContent = changeText(r.c.zone, ch, now);
      if (!editing) drawStrip(r.canvas, r.c.zone, T);
    }
    statusEl.classList.toggle('live', pinned === null);
    statusEl.classList.toggle('pinned', pinned !== null);
    nowBtn.hidden = pinned === null;
    if (pinned === null) statusText.textContent = 'Now';
    else if (Math.abs(pinned - now) < M) statusText.textContent = 'Now (fixed)';
    else statusText.textContent = pinned > now ? 'In ' + fmtSpan(pinned - now) : fmtSpan(now - pinned) + ' ago';
    hint.hidden = editing;
    prefs.hidden = !editing;
    h24Box.checked = state.h24;
  }
  let raf = 0;
  const requestRender = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };

  let timer = 0;
  function tick() {
    clearTimeout(timer);
    render();
    timer = setTimeout(tick, M - Date.now() % M + 50);
  }

  // ---- add-city sheet ----
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  let shown = [];
  let sheetMode = 'add';
  function renderResults() {
    const n = norm(q.value);
    const nowOff = offsetMin(HERE_ZONE, Date.now());
    const pool = sheetMode === 'home' ? CITIES.concat(EXTRA).filter(c => offsetMin(c.zone, Date.now()) === nowOff) : CITIES;
    if (!n) {
      shown = pool.filter(c => sheetMode === 'add' || CITIES.includes(c)).sort((a, b) => a.name.localeCompare(b.name));
    } else {
      const scored = [];
      for (const c of sheetMode === 'home' ? pool : CITIES.concat(EXTRA)) {
        const nm = norm(c.name), co = norm(c.country), z = norm(c.zone);
        const s = nm.startsWith(n) ? 0 : nm.includes(n) ? 1 : co.startsWith(n) ? 2 : co.includes(n) ? 3 : z.includes(n) ? 4 : -1;
        if (s >= 0) scored.push([s, c]);
      }
      shown = scored.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).slice(0, 80).map(x => x[1]);
    }
    const now = Date.now(), hereOff = offsetMin(HERE_ZONE, now);
    results.innerHTML = shown.length ? shown.map((c, i) => {
      const w = wall(c.zone, now), t = fmtTime(w);
      const home = hereCity();
      const added = sheetMode === 'home' ? (c.name === home.name && c.zone === home.zone) : state.cities.some(x => x.zone === c.zone && x.name === c.name);
      return `<button class="result" type="button" data-i="${i}"${added ? ' disabled' : ''}>
        <span class="r-who"><span class="r-name">${esc(c.name)}</span><span class="r-country">${esc(c.country)}${added ? (sheetMode === 'home' ? ' · current' : ' · added') : ''}</span></span>
        <span class="r-time"><b>${t.hm}${t.ap ? ' ' + t.ap : ''}</b>${fmtDiff(w.off - hereOff)}</span>
      </button>`;
    }).join('') : `<p class="empty">No city or time zone matches “${esc(q.value)}”.</p>`;
  }
  function openSheet(mode) {
    sheetMode = mode === 'home' ? 'home' : 'add';
    $('sheetTitle').textContent = sheetMode === 'home' ? 'Your city' : 'Add a city';
    q.value = '';
    sheet.hidden = false;
    renderResults();
    results.scrollTop = 0;
    q.focus();
  }
  function closeSheet() { sheet.hidden = true; q.blur(); }
  results.addEventListener('click', e => {
    const b = e.target.closest('.result');
    if (!b || b.disabled) return;
    const c = shown[+b.dataset.i];
    const pickd = { name: c.name, country: c.country, zone: c.zone };
    if (sheetMode === 'home') state.homeFor[HERE_ZONE] = pickd;
    else state.cities.push(pickd);
    store.save();
    closeSheet();
    buildList();
  });
  q.addEventListener('input', renderResults);
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  cancelAdd.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

  // ---- controls ----
  addBtn.addEventListener('click', () => openSheet('add'));
  editBtn.addEventListener('click', () => {
    editing = !editing;
    document.body.classList.toggle('editing', editing);
    editBtn.textContent = editing ? 'Done' : 'Edit';
    render();
  });
  nowBtn.addEventListener('click', () => { pinned = null; render(); });
  h24Box.addEventListener('change', () => { state.h24 = h24Box.checked; store.save(); render(); });

  window.addEventListener('resize', requestRender);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', requestRender); } catch (e) { /* old Safari */ }
  new MutationObserver(requestRender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(requestRender);

  buildList();
  tick();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
